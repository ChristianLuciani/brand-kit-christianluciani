  <rect width="3840" height="2160" fill="url(#amb)"/>
  <ellipse cx="2740" cy="520"  rx="1500" ry="1150" fill="url(#nova)"/>
  <ellipse cx="420"  cy="1720" rx="1400" ry="1100" fill="url(#coral)"/>
  <ellipse cx="3520" cy="1820" rx="1200" ry="900"  fill="url(#ambar)"/>
