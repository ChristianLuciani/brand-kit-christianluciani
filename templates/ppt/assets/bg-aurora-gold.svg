      <stop offset="0%"  stop-color="#0b1120"/>
      <stop offset="62%" stop-color="#050810"/>
      <stop offset="100%" stop-color="#050810"/>
    </radialGradient>
    <radialGradient id="oro" gradientUnits="userSpaceOnUse" cx="2760" cy="1560" r="1750">
