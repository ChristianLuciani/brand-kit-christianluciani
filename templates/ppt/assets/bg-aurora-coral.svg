<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2160" viewBox="0 0 3840 2160">
  <!-- CL Coral Aurora — base night + mesh de luces (supernova, coral, ámbar, teal) -->
  <defs>
    <radialGradient id="amb" gradientUnits="userSpaceOnUse" cx="1920" cy="820" r="2600">
      <stop offset="0%"  stop-color="#0b1120"/>
      <stop offset="62%" stop-color="#050810"/>
      <stop offset="100%" stop-color="#050810"/>
    </radialGradient>
    <radialGradient id="nova" gradientUnits="userSpaceOnUse" cx="2740" cy="520" r="1500">
      <stop offset="0%"  stop-color="#ffb3a0" stop-opacity="0.34"/>
      <stop offset="45%" stop-color="#ffb3a0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffb3a0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coral" gradientUnits="userSpaceOnUse" cx="420" cy="1720" r="1400">
      <stop offset="0%"  stop-color="#ff8a70" stop-opacity="0.24"/>
      <stop offset="50%" stop-color="#ff8a70" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ff8a70" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambar" gradientUnits="userSpaceOnUse" cx="3520" cy="1820" r="1200">
